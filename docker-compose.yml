version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: legalmetrix_postgres
    environment:
      POSTGRES_DB: legalmetrix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalmetrix_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/legalmetrix
      SECRET_KEY: legalmetrix-production-demo-key-2026
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legalmetrix_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
